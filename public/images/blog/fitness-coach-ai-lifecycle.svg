<svg width="760" height="700" viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fitness Coach on-device AI readiness lifecycle</title>
<desc>Checking branches to download required, downloading, available, unavailable, or failed. Download required leads to download, then warm-up. Available also leads to warm-up. Warm-up leads to ready or failed. Ready leads to inference, then close. Failed leads to try again.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="280" y="16" width="200" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="380" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Checking</text>

<line x1="380" y1="68" x2="380" y2="92" stroke="#333333" stroke-width="0.5"/>
<line x1="88" y1="92" x2="672" y2="92" stroke="#333333" stroke-width="0.5"/>
<line x1="88" y1="92" x2="88" y2="108" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="234" y1="92" x2="234" y2="108" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="92" x2="380" y2="108" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="526" y1="92" x2="526" y2="108" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="672" y1="92" x2="672" y2="108" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="22" y="108" width="132" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="88" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C">Download required</text>
<text x="88" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">One-time setup</text>

<rect x="168" y="108" width="132" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="234" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C">Downloading</text>
<text x="234" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#712B13">Already in AICore</text>

<rect x="314" y="108" width="132" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="380" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C">Available</text>
<text x="380" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#3C3489">Assets on device</text>

<rect x="460" y="108" width="132" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="526" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Unavailable</text>
<text x="526" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">Not right now</text>

<rect x="606" y="108" width="132" height="52" rx="8" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.5"/>
<text x="672" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1212">Failed</text>
<text x="672" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#7A2424">Status check</text>

<line x1="88" y1="160" x2="88" y2="196" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="22" y="196" width="132" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="88" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">Download</text>

<line x1="234" y1="160" x2="234" y2="196" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="168" y="196" width="132" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="234" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">Check again</text>

<line x1="88" y1="240" x2="88" y2="318" stroke="#333333" stroke-width="0.5"/>
<line x1="88" y1="318" x2="134" y2="318" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="380" y1="160" x2="380" y2="318" stroke="#333333" stroke-width="0.5"/>
<line x1="380" y1="318" x2="334" y2="318" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="134" y="292" width="200" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="234" y="312" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Warm-up</text>
<text x="234" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Load into memory</text>

<line x1="234" y1="344" x2="234" y2="372" stroke="#333333" stroke-width="0.5"/>
<line x1="145" y1="372" x2="355" y2="372" stroke="#333333" stroke-width="0.5"/>
<line x1="145" y1="372" x2="145" y2="396" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="355" y1="372" x2="355" y2="396" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="70" y="396" width="150" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Ready</text>

<rect x="280" y="396" width="150" height="52" rx="8" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.5"/>
<text x="355" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1212">Failed</text>

<line x1="430" y1="422" x2="486" y2="422" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="486" y="396" width="150" height="52" rx="8" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.5"/>
<text x="561" y="422" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1212">Try again</text>

<line x1="145" y1="448" x2="145" y2="484" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="70" y="484" width="150" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="508" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Inference</text>

<line x1="145" y1="532" x2="145" y2="568" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="70" y="568" width="150" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="145" y="592" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Close</text>

<text x="380" y="660" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Failed can come from the status check, the download, or the warm-up. Each path can be tried again.</text>
</svg>
