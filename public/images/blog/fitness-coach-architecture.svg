<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fitness Coach clean architecture diagram</title>
<desc>Compose UI observes a ViewModel, which calls a use case, which calls a FitnessInsightEngine interface. Two implementations sit behind that interface: a real Gemini Nano engine and a fake engine for previews and tests.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="240" y="30" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Compose UI</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Observes state, shows insight</text>
<line x1="340" y1="86" x2="340" y2="120" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="240" y="120" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">FitnessCoachViewModel</text>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Exposes StateFlow</text>
<line x1="340" y1="176" x2="340" y2="210" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="210" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">GenerateFitnessInsightUseCase</text>
<text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">The one entry point</text>
<line x1="340" y1="266" x2="340" y2="300" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="300" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">FitnessInsightEngine</text>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Interface, swappable underneath</text>

<line x1="290" y1="356" x2="200" y2="400" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="390" y1="356" x2="480" y2="400" stroke="#333333" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="80" y="400" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="190" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">GeminiNanoInsightEngine</text>
<text x="190" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">ML Kit GenAI Prompt API</text>

<rect x="380" y="400" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="490" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">FakeInsightEngine</text>
<text x="490" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Previews, tests, emulator</text>

<text x="340" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The ViewModel only ever talks to the interface, never to an implementation directly</text>
</svg>
